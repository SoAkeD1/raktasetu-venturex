<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the Rudhira Network</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23170404%22/><circle cx=%2250%22 cy=%2250%22 r=%2232%22 stroke=%22%23c81e3a%22 stroke-width=%226%22 fill=%22none%22 opacity=%220.5%22/><circle cx=%2250%22 cy=%2250%22 r=%2220%22 stroke=%22%23c81e3a%22 stroke-width=%226%22 fill=%22none%22 opacity=%220.75%22/><circle cx=%2250%22 cy=%2250%22 r=%229%22 fill=%22%23e02020%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f8; --surface:#ffffff; --surface-2:#f1efec; --ink:#1c1b1a;
    --ink-soft:#54514d; --ink-faint:#8a8681; --line:#e2ded8; --accent:#c81e3a;
    --accent-ink:#ffffff; --good:#1f7a4d; --bad:#b5321f; --good-bg:#eaf4ee; --bad-bg:#fbeceA;
    --radius:14px;
    --font-sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#131211; --surface:#1b1a18; --surface-2:#221f1d; --ink:#f2f0ed;
      --ink-soft:#c2beb8; --ink-faint:#8a8681; --line:#332f2b; --accent:#ff5c72;
      --accent-ink:#1c1b1a; --good:#5fd996; --bad:#ff7a63; --good-bg:#16281f; --bad-bg:#2c1a16;
    }
  }
  :root[data-theme="dark"]{
    --bg:#131211; --surface:#1b1a18; --surface-2:#221f1d; --ink:#f2f0ed;
    --ink-soft:#c2beb8; --ink-faint:#8a8681; --line:#332f2b; --accent:#ff5c72;
    --accent-ink:#1c1b1a; --good:#5fd996; --bad:#ff7a63; --good-bg:#16281f; --bad-bg:#2c1a16;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:var(--font-sans); line-height:1.5; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center;
  }
  .topbar{width:100%; display:flex; align-items:center; justify-content:space-between; padding:20px 24px; box-sizing:border-box;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:600; font-size:16px; text-decoration:none; color:var(--ink);}
  .theme-toggle{
    width:36px; height:36px; padding:0; flex:none; border-radius:50%;
    border:1px solid var(--line); background:transparent; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    color:var(--ink-soft); transition:border-color .2s ease, color .2s ease;
  }
  .theme-toggle:hover{color:var(--ink); border-color:var(--ink-faint);}
  .theme-toggle svg{width:17px; height:17px;}
  .theme-toggle .icon-sun{display:none;}
  .theme-toggle.is-dark .icon-sun{display:block;}
  .theme-toggle.is-dark .icon-moon{display:none;}

  .card-wrap{flex:1; width:100%; display:flex; align-items:center; justify-content:center; padding:24px;}
  .card{
    width:100%; max-width:480px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:32px; box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .concept-badge{
    display:inline-block; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    color:var(--ink-soft); background:var(--surface-2); border:1px solid var(--line);
    border-radius:999px; padding:4px 10px; margin-bottom:14px;
  }
  .card h1{font-size:22px; margin:0 0 4px;}
  .card .lede{color:var(--ink-soft); font-size:14px; margin:0 0 24px;}

  .tabs{display:flex; border:1px solid var(--line); border-radius:10px; padding:3px; margin-bottom:24px;}
  .tab-btn{
    flex:1; background:none; border:none; padding:9px 4px; border-radius:8px;
    font-family:var(--font-sans); font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .tab-btn.active{background:var(--accent); color:var(--accent-ink);}

  .role-form{display:none;}
  .role-form.active{display:block;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field .hint{font-weight:400; color:var(--ink-faint); margin-left:4px;}
  .field input, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface); color:var(--ink); font-family:var(--font-sans); font-size:14px;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .btn-primary{
    width:100%; padding:11px 0; border:none; border-radius:8px; background:var(--accent);
    color:var(--accent-ink); font-family:var(--font-sans); font-size:14px; font-weight:600; cursor:pointer;
  }
  .btn-secondary{
    width:100%; padding:10px 0; border:1px solid var(--line); border-radius:8px; background:transparent;
    color:var(--ink); font-family:var(--font-sans); font-size:14px; font-weight:600; cursor:pointer; margin-top:10px;
  }

  .error-text{color:var(--bad); font-size:13px; margin:-8px 0 16px; display:none;}
  .error-text.show{display:block;}

  .welcome dl{display:grid; grid-template-columns:auto 1fr; gap:8px 16px; margin:20px 0; font-size:14px;}
  .welcome dt{color:var(--ink-soft);}
  .welcome dd{margin:0; font-weight:600;}
  .status-line{background:var(--surface-2); border-radius:10px; padding:14px 16px; font-size:13px; color:var(--ink-soft); margin-bottom:20px;}
  .link-row{display:flex; justify-content:space-between; margin-top:20px; font-size:13px;}
  .link-row a{color:var(--accent); text-decoration:none; font-weight:600; cursor:pointer;}

  .screen{display:none;}
  .screen.active{display:block;}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><circle cx="13" cy="13" r="11" stroke="var(--accent)" stroke-width="1.3" opacity="0.35"/><circle cx="13" cy="13" r="8" stroke="var(--accent)" stroke-width="1.3" opacity="0.55"/><circle cx="13" cy="13" r="5.2" stroke="var(--accent)" stroke-width="1.3" opacity="0.8"/><circle cx="13" cy="13" r="2.1" fill="var(--accent)"/></svg>
    Rudhira
  </a>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
  </button>
</div>

<div class="card-wrap">
  <div class="card">

    <div class="screen active" id="screen-join">
      <span class="concept-badge">Concept preview &middot; not a live signup</span>
      <h1>Join the Rudhira network</h1>
      <p class="lede">Rudhira connects three sides of the blood and plasma supply chain. See how each one would sign up.</p>

      <div class="tabs" role="tablist">
        <button class="tab-btn active" id="tab-donor" type="button" role="tab" aria-selected="true">Blood Donor</button>
        <button class="tab-btn" id="tab-hospital" type="button" role="tab" aria-selected="false">Hospital</button>
        <button class="tab-btn" id="tab-fractionator" type="button" role="tab" aria-selected="false">Plasma Fractionator</button>
      </div>

      <form class="role-form active" id="form-donor" data-role="donor" novalidate>
        <div class="field"><label for="d-name">Name</label><input id="d-name" name="name" type="text" required></div>
        <div class="field"><label for="d-email">Email</label><input id="d-email" name="email" type="email" required></div>
        <div class="field"><label for="d-age">Age</label><input id="d-age" name="age" type="number" min="1" max="120" required></div>
        <div class="field">
          <label for="d-bloodgroup">Blood Group</label>
          <select id="d-bloodgroup" name="bloodGroup" required>
            <option value="" disabled selected>Select your blood group</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
          </select>
        </div>
        <p class="error-text" id="d-error"></p>
        <button class="btn-primary" type="submit">Preview donor sign-up</button>
      </form>

      <form class="role-form" id="form-hospital" data-role="hospital" novalidate>
        <div class="field"><label for="h-name">Hospital name</label><input id="h-name" name="hospitalName" type="text" required></div>
        <div class="field"><label for="h-email">Registered email</label><input id="h-email" name="email" type="email" required></div>
        <div class="field"><label for="h-regid">NABH / registration ID<span class="hint">(any hospital license number)</span></label><input id="h-regid" name="regId" type="text" required></div>
        <div class="field"><label for="h-city">Nearest Rudhira hub</label>
          <select id="h-city" name="city" required>
            <option value="" disabled selected>Select a city</option>
            <option>Nagpur</option><option>Pune</option><option>Delhi NCR</option>
            <option>Bengaluru</option><option>Kolkata</option><option>Other</option>
          </select>
        </div>
        <p class="error-text" id="h-error"></p>
        <button class="btn-primary" type="submit">Preview hospital sign-up</button>
      </form>

      <form class="role-form" id="form-fractionator" data-role="fractionator" novalidate>
        <div class="field"><label for="f-name">Company name</label><input id="f-name" name="companyName" type="text" required></div>
        <div class="field"><label for="f-email">Business email</label><input id="f-email" name="email" type="email" required></div>
        <div class="field"><label for="f-type">Facility type</label>
          <select id="f-type" name="facilityType" required>
            <option value="" disabled selected>Select facility type</option>
            <option>Licensed plasma fractionator</option>
            <option>Plasma-derived medicine manufacturer</option>
          </select>
        </div>
        <div class="field"><label for="f-volume">Monthly plasma requirement <span class="hint">(litres)</span></label><input id="f-volume" name="volume" type="number" min="1" required></div>
        <p class="error-text" id="f-error"></p>
        <button class="btn-primary" type="submit">Preview fractionator sign-up</button>
      </form>
    </div>

    <div class="screen welcome" id="screen-welcome">
      <span class="concept-badge">Concept preview &middot; not a live signup</span>
      <h1 id="welcome-heading">Welcome</h1>
      <dl id="welcome-fields"></dl>
      <p class="status-line" id="welcome-note"></p>
      <button class="btn-secondary" id="preview-another">Preview another role</button>
      <div class="link-row">
        <a href="index.html">&larr; Back to Rudhira</a>
        <span></span>
      </div>
    </div>

  </div>
</div>

<script>
  (function initTheme(){
    const root = document.documentElement;
    const btn = document.getElementById('themeToggle');
    const stored = localStorage.getItem('rudhira-theme');
    if(stored === 'light' || stored === 'dark') root.setAttribute('data-theme', stored);
    function effectiveDark(){
      const explicit = root.getAttribute('data-theme');
      if(explicit === 'dark') return true;
      if(explicit === 'light') return false;
      return window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
    function syncButton(){
      const dark = effectiveDark();
      btn.classList.toggle('is-dark', dark);
      btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    }
    btn.addEventListener('click', function(){
      const next = effectiveDark() ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('rudhira-theme', next);
      syncButton();
    });
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
      if(!localStorage.getItem('rudhira-theme')) syncButton();
    });
    syncButton();
  })();

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(function(el){ el.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  (function initTabs(){
    var tabs = {
      donor: document.getElementById('tab-donor'),
      hospital: document.getElementById('tab-hospital'),
      fractionator: document.getElementById('tab-fractionator')
    };
    var forms = {
      donor: document.getElementById('form-donor'),
      hospital: document.getElementById('form-hospital'),
      fractionator: document.getElementById('form-fractionator')
    };
    function selectRole(role){
      Object.keys(tabs).forEach(function(key){
        var isActive = key === role;
        tabs[key].classList.toggle('active', isActive);
        tabs[key].setAttribute('aria-selected', isActive ? 'true' : 'false');
        forms[key].classList.toggle('active', isActive);
      });
    }
    Object.keys(tabs).forEach(function(role){
      tabs[role].addEventListener('click', function(){ selectRole(role); });
    });
  })();

  var WELCOME_COPY = {
    donor: function(f){
      return {
        heading: 'Welcome, ' + f.name,
        fields: [
          ['Blood Group', f.bloodGroup],
          ['Age', f.age],
          ['Email', f.email]
        ],
        note: 'In the full platform, you would now be part of Rudhira’s donor network — verified donations move you through the Bronze to Plasma Elite reward tiers.'
      };
    },
    hospital: function(f){
      return {
        heading: 'Welcome, ' + f.hospitalName,
        fields: [
          ['Registration ID', f.regId],
          ['Nearest hub', f.city],
          ['Email', f.email]
        ],
        note: 'In the full platform, ' + f.hospitalName + ' would now be a verified receiving node in Rudhira’s hub-and-spoke network.'
      };
    },
    fractionator: function(f){
      return {
        heading: 'Welcome, ' + f.companyName,
        fields: [
          ['Facility type', f.facilityType],
          ['Monthly requirement', f.volume + ' L'],
          ['Email', f.email]
        ],
        note: 'In the full platform, ' + f.companyName + ' would now be a verified buyer for Rudhira’s surplus recovered plasma.'
      };
    }
  };

  function renderWelcome(role, formData){
    var copy = WELCOME_COPY[role](formData);
    document.getElementById('welcome-heading').textContent = copy.heading;
    document.getElementById('welcome-note').textContent = copy.note;
    var dl = document.getElementById('welcome-fields');
    dl.innerHTML = '';
    copy.fields.forEach(function(pair){
      var dt = document.createElement('dt'); dt.textContent = pair[0];
      var dd = document.createElement('dd'); dd.textContent = pair[1];
      dl.appendChild(dt); dl.appendChild(dd);
    });
    showScreen('screen-welcome');
  }

  ['form-donor', 'form-hospital', 'form-fractionator'].forEach(function(formId){
    var form = document.getElementById(formId);
    var role = form.getAttribute('data-role');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var data = new FormData(form);
      var formData = {};
      data.forEach(function(value, key){ formData[key] = value; });
      renderWelcome(role, formData);
    });
  });

  document.getElementById('preview-another').addEventListener('click', function(){
    showScreen('screen-join');
  });
</script>

</body>
</html>
