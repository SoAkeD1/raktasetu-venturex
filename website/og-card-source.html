<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{width:1200px; height:630px; background:#faf9f8; font-family:'IBM Plex Sans',sans-serif; position:relative; overflow:hidden;}
  .grid{position:absolute; inset:0; background-image:linear-gradient(#e2ded8 1px, transparent 1px), linear-gradient(90deg, #e2ded8 1px, transparent 1px); background-size:60px 60px; opacity:.5;}
  .content{position:relative; z-index:1; padding:80px; height:100%; display:flex; flex-direction:column; justify-content:center;}
  .brand{display:flex; align-items:center; gap:14px; margin-bottom:36px;}
  .brand span{font-size:30px; font-weight:700; color:#1c1b1a;}
  h1{font-size:58px; font-weight:700; color:#1c1b1a; line-height:1.12; letter-spacing:-0.01em; max-width:920px;}
  .accent{color:#c81e3a;}
  p{margin-top:26px; font-size:26px; color:#54514d; max-width:840px; line-height:1.4;}
  .foot{position:absolute; bottom:70px; left:80px; font-family:'IBM Plex Mono',monospace; font-size:20px; color:#8a8681;}
</style></head>
<body>
  <div class="grid"></div>
  <div class="content">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="11" stroke="#c81e3a" stroke-width="2"/><circle cx="13" cy="13" r="3.5" fill="#c81e3a"/></svg>
      <span>RaktaSetu</span>
    </div>
    <h1>We don't sell blood.<br>We stop wasting <span class="accent">its plasma.</span></h1>
    <p>A self-sustaining blood and plasma supply model for India. VentureX 2026, Problem Statement 8.</p>
    <div class="foot">Entrepreneurship Cell, IIT (ISM) Dhanbad</div>
  </div>
</body></html>
